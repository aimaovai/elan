services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elan}
      POSTGRES_USER: ${POSTGRES_USER:-elan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elan_local_only}
    ports:
      - "5433:5432"
    volumes:
      - elan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elan} -d ${POSTGRES_DB:-elan}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elan-postgres:
