server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${ADMIN_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        path: /
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: elan-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/elan}
    username: ${SPRING_DATASOURCE_USERNAME:elan}
    password: ${SPRING_DATASOURCE_PASSWORD:elan_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
elan:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  admin:
    bootstrap-email: ${ELAN_ADMIN_EMAIL:}
    bootstrap-password: ${ELAN_ADMIN_PASSWORD:}
    bootstrap-display-name: ${ELAN_ADMIN_DISPLAY_NAME:ÉLAN Administrator}
  email:
    delivery-mode: ${EMAIL_DELIVERY_MODE:log}
    resend-enabled: ${RESEND_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
    from-name: ${RESEND_FROM_NAME:ÉLAN Reservations}
    reply-to: ${RESEND_REPLY_TO:}
    test-recipient: ${RESEND_TEST_RECIPIENT:}
    private-dining-admin-email: ${PRIVATE_DINING_ADMIN_EMAIL:}
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    encryption-key: ${ELAN_NOTIFICATION_ENCRYPTION_KEY:}
